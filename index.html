<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kanban de proyectos</title>
    <script>
      // Modo de color guardado (AC-043, D-017) antes de pintar, sin destello.
      // Misma clave que COLOR_MODE_STORAGE_KEY en src/state/color-mode.svelte.ts.
      (function () {
        try {
          var mode = localStorage.getItem('kanban-board:color-mode');
          if (mode === 'light' || mode === 'dark') document.documentElement.setAttribute('data-theme', mode);
        } catch (e) {
          // Almacenamiento no disponible: se queda en Auto, sin error.
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
